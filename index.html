<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Hola</h1>
        <p id="parrafo">Hola, este es un parrafo HTML</p>
        <button onclick="saludar()">SALUDAR</button>
        <script>

            const saludar = () => {
                console.log("saludando..");

            }

        </script>
    </body>

</html>
